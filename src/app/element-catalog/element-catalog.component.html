<div class="left-panel">
  <div class="search-bar-container">
    <input type="text" class="search-bar" placeholder="Search" [ngModel]="searchTerm" (ngModelChange)="searchTermChange.emit($event)" />
  </div>
  <div class="elements-list">
    <ng-container *ngFor="let category of uniqueCategories">
      <div class="category-title">
        {{ category }}
      </div>
      <div class="category-elements">
        <div 
          *ngFor="let element of getElementsByCategory(category)"
          class="element-item"
          draggable="true"
          (dragstart)="onDragStart($event, element)"
        >
          <span class="element-icon">{{ element.icon }}</span>
          <span class="element-label">{{ element.label }}</span>
        </div>
      </div>
    </ng-container>
  </div>
</div>
